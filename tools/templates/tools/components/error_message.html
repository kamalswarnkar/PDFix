<div class="error-alert" id="errorAlert" role="alert"{% if not error_message %} style="display:none;"{% endif %}>
    <span style="font-size:18px;" aria-hidden="true">⚠️</span>
    <span id="errorAlertText">{{ error_message }}</span>
    <button type="button" class="close-alert" aria-label="Dismiss"
            onclick="document.getElementById('errorAlert').style.display='none'">&times;</button>
</div>
