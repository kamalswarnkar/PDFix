{% comment %}
Shared password input with a show/hide toggle.
Params: field_name, placeholder, confirm (bool), hint (optional text).
{% endcomment %}
<style>
    .password-field{
        display:flex;
        align-items:center;
        justify-content:center;
        gap:8px;
        margin-top:10px;
    }

    .password-field input{
        padding:10px 12px;
        min-width:260px;
        border:1px solid #d1d5db;
        border-radius:5px;
        font-size:14px;
        font-family:inherit;
    }

    .toggle-password{
        border:2px solid #d1d5db;
        background:#f3f4f6;
        color:#374151;
        border-radius:6px;
        width:42px;
        height:42px;
        display:flex;
        align-items:center;
        justify-content:center;
        cursor:pointer;
        padding:0;
        transition:background 0.15s, border-color 0.15s;
    }

    .toggle-password:hover{ background:#e5e7eb; border-color:#9ca3af; }
    .toggle-password.active{ border-color:#dc2626; background:#fee2e2; color:#dc2626; }

    .password-hint{
        font-size:12px;
        color:#6b7280;
        text-align:center;
        margin:8px 0 0 0;
    }

    .password-mismatch{
        font-size:12px;
        color:#b91c1c;
        text-align:center;
        margin:8px 0 0 0;
        display:none;
    }
</style>

<div class="password-field">
    <input type="password" id="passwordInput" name="{{ field_name|default:'pwd' }}"
           placeholder="{{ placeholder|default:'Enter password' }}" autocomplete="off" required>
    <button type="button" class="toggle-password" id="togglePassword" aria-label="Show password">
        <span id="eyeIcon" style="display:flex;align-items:center;"></span>
    </button>
</div>

{% if confirm %}
<div class="password-field">
    <input type="password" id="passwordConfirm" name="pwd_confirm"
           placeholder="Repeat password" autocomplete="off" required>
    <span style="width:42px;" aria-hidden="true"></span>
</div>
<p class="password-mismatch" id="passwordMismatch">The two passwords do not match.</p>
{% endif %}

{% if hint %}<p class="password-hint">{{ hint }}</p>{% endif %}

<script>
    (function() {
        const input = document.getElementById("passwordInput");
        const toggle = document.getElementById("togglePassword");
        const eyeIcon = document.getElementById("eyeIcon");
        const confirmInput = document.getElementById("passwordConfirm");
        const mismatch = document.getElementById("passwordMismatch");

        const eyeOpen = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';
        const eyeClosed = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>';

        eyeIcon.innerHTML = eyeOpen;

        toggle.addEventListener("click", function() {
            const wasHidden = input.type === "password";
            const nextType = wasHidden ? "text" : "password";
            input.type = nextType;
            if (confirmInput) confirmInput.type = nextType;
            toggle.classList.toggle("active", wasHidden);
            eyeIcon.innerHTML = wasHidden ? eyeClosed : eyeOpen;
            toggle.setAttribute("aria-label", wasHidden ? "Hide password" : "Show password");
        });

        if (confirmInput) {
            // Catch the typo before the file is encrypted with a password
            // nobody knows.
            const form = input.closest("form");
            if (form) {
                form.addEventListener("submit", function(e) {
                    if (input.value !== confirmInput.value) {
                        e.preventDefault();
                        mismatch.style.display = "block";
                        confirmInput.focus();
                    } else {
                        mismatch.style.display = "none";
                    }
                }, true);
            }
        }
    })();
</script>
