<script>
    (function() {
        const dropZone = document.getElementById("dropZone");
        const fileInput = document.getElementById("fileInput");
        const container = document.getElementById("previewContainer");
        const errorAlert = document.getElementById("errorAlert");
        const errorAlertText = document.getElementById("errorAlertText");
        const form = document.getElementById("uploadForm") || (fileInput ? fileInput.closest("form") : null);

        if (!fileInput) return;

        const isMultiple = fileInput.hasAttribute("multiple");
        const acceptAttr = fileInput.getAttribute("accept") || "";
        const allowedExtensions = acceptAttr ? acceptAttr.split(",").map(ext => ext.trim().toLowerCase()) : [];
        const maxBytes = (parseInt(fileInput.dataset.maxMb, 10) || 50) * 1024 * 1024;
        const maxFiles = parseInt(fileInput.dataset.maxFiles, 10) || 25;

        window.filesArray = [];

        function showError(msg) {
            if (errorAlert && errorAlertText) {
                errorAlertText.textContent = msg;
                errorAlert.style.display = "flex";
            } else {
                alert(msg);
            }
        }

        function clearError() {
            if (errorAlert) errorAlert.style.display = "none";
        }

        function getFileExtension(filename) {
            const dot = filename.lastIndexOf(".");
            return dot === -1 ? "" : filename.substring(dot).toLowerCase();
        }

        function isValidFileType(file) {
            if (allowedExtensions.length === 0) return true;
            return allowedExtensions.includes(getFileExtension(file.name));
        }

        function formatBytes(bytes) {
            if (bytes === 0) return "0 Bytes";
            const k = 1024;
            const sizes = ["Bytes", "KB", "MB", "GB"];
            const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
        }

        window.removeFile = function(index) {
            window.filesArray.splice(index, 1);
            fileInput.value = "";
            triggerFilesChanged();
        };

        function triggerFilesChanged() {
            if (typeof window.onFilesChanged === "function") {
                window.onFilesChanged(window.filesArray);
            } else {
                window.defaultRenderFiles();
            }
        }
        window.triggerFilesChanged = triggerFilesChanged;

        window.defaultRenderFiles = function() {
            if (!container) return;
            container.innerHTML = "";

            window.filesArray.forEach((file, index) => {
                const ext = getFileExtension(file.name).replace(".", "");
                const card = document.createElement("div");
                card.className = "file-card";

                let cardType = "generic";
                let iconChar = "📄";

                if (ext === "pdf") {
                    cardType = "pdf";
                } else if (ext === "docx" || ext === "doc") {
                    cardType = "word";
                    iconChar = "📘";
                } else if (["png", "jpg", "jpeg", "webp"].includes(ext)) {
                    cardType = "image";
                    iconChar = "🖼️";
                }

                card.classList.add(cardType);
                card.dataset.name = file.name;
                // Hold the File itself so drag-reorder does not have to match by
                // name - two uploads can legitimately share a filename.
                card._file = file;

                // textContent for the name: a filename can contain markup.
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "remove-btn";
                remove.setAttribute("aria-label", "Remove " + file.name);
                remove.innerHTML = "&times;";
                remove.addEventListener("click", () => window.removeFile(index));

                const icon = document.createElement("div");
                icon.className = "file-icon img-preview-container";
                icon.textContent = iconChar;

                const nameEl = document.createElement("div");
                nameEl.className = "file-name";
                nameEl.title = file.name;
                nameEl.textContent = file.name;

                const sizeEl = document.createElement("div");
                sizeEl.className = "file-size";
                sizeEl.textContent = formatBytes(file.size);

                card.append(remove, icon, nameEl, sizeEl);
                container.appendChild(card);

                if (cardType === "image") {
                    const url = URL.createObjectURL(file);
                    const img = document.createElement("img");
                    img.src = url;
                    img.alt = "";
                    img.style.cssText = "width:100%;height:40px;object-fit:contain;border-radius:4px;";
                    img.onload = () => URL.revokeObjectURL(url);
                    icon.textContent = "";
                    icon.appendChild(img);
                }
            });
        };

        function handleFileSelection(newFiles) {
            clearError();
            const problems = [];
            const filesToProcess = Array.from(newFiles);

            function accept(file) {
                if (!isValidFileType(file)) {
                    problems.push(`"${file.name}" is not an accepted format.`);
                    return false;
                }
                if (file.size === 0) {
                    problems.push(`"${file.name}" is empty.`);
                    return false;
                }
                if (file.size > maxBytes) {
                    problems.push(`"${file.name}" is ${formatBytes(file.size)} — the limit is ${formatBytes(maxBytes)}.`);
                    return false;
                }
                return true;
            }

            if (!isMultiple) {
                if (filesToProcess.length > 0 && accept(filesToProcess[0])) {
                    window.filesArray = [filesToProcess[0]];
                }
            } else {
                filesToProcess.forEach(file => {
                    if (!accept(file)) return;
                    const duplicate = window.filesArray.some(f =>
                        f.name === file.name &&
                        f.size === file.size &&
                        f.lastModified === file.lastModified
                    );
                    if (duplicate) return;
                    if (window.filesArray.length >= maxFiles) {
                        problems.push(`Only ${maxFiles} files can be uploaded at a time.`);
                        return;
                    }
                    window.filesArray.push(file);
                });
            }

            if (problems.length) {
                showError(problems.slice(0, 3).join(" "));
            }

            fileInput.value = "";  // reset so re-picking the same file still fires change
            triggerFilesChanged();
        }

        if (dropZone) {
            dropZone.addEventListener("dragover", e => {
                e.preventDefault();
                dropZone.classList.add("dragover");
            });

            dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));

            dropZone.addEventListener("drop", e => {
                e.preventDefault();
                dropZone.classList.remove("dragover");
                if (e.dataTransfer && e.dataTransfer.files) {
                    handleFileSelection(e.dataTransfer.files);
                }
            });

            // ponytail: guard prevents double-trigger when clicking the <input> inside the drop zone
            dropZone.addEventListener("click", e => {
                if (e.target === fileInput) return;
                fileInput.click();
            });

            dropZone.addEventListener("keydown", e => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    fileInput.click();
                }
            });
        }

        fileInput.addEventListener("change", () => {
            if (fileInput.files && fileInput.files.length > 0) {
                handleFileSelection(fileInput.files);
            }
        });

        if (form) {
            form.addEventListener("submit", e => {
                if (window.filesArray.length === 0) {
                    e.preventDefault();
                    showError("Please select at least one file before submitting.");
                    return;
                }

                // Copy our ordered list back into the real input before it is sent.
                const dataTransfer = new DataTransfer();
                window.filesArray.forEach(file => dataTransfer.items.add(file));
                fileInput.files = dataTransfer.files;
            });
        }
    })();
</script>
