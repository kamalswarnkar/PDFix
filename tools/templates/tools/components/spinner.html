{% comment %}
Markup and style together: no tool ever wants one without the other.

The <style> deliberately sits here in the body rather than in the head block -
the client-side navigation in base.html swaps .container only, so anything left
in the head is missing after an in-app link click.
{% endcomment %}
<div id="loader" style="display:none;">
    <h3 id="statusText">Processing your file...</h3>
    <div class="spinner"></div>
</div>

<style>
    .spinner{
        margin:auto;
        margin-top:20px;
        width:40px;
        height:40px;
        border:4px solid #ddd;
        border-top:4px solid #e5322d;
        border-radius:50%;
        animation:spin 1s linear infinite;
    }

    @keyframes spin{
        0%{transform:rotate(0deg);}
        100%{transform:rotate(360deg);}
    }
</style>
